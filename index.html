<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌙 Good Night</title>

    <!-- Loading Screen (inline, renders before JS) -->
    <style>
      #loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #0a0a0f;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader-title {
        font: 2.4rem Georgia, "Noto Serif SC", serif;
        color: #e8e0d4; letter-spacing: 0.1em;
        animation: loader-breathe 3s ease-in-out infinite;
      }
      .loader-sub {
        margin-top: 12px;
        font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase;
        color: rgba(232,224,212,0.35);
      }
      .loader-dots { margin-top: 32px; display: flex; gap: 10px; }
      .loader-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #d4a574;
        animation: loader-dot 1.4s ease-in-out infinite;
      }
      .loader-dot:nth-child(2) { animation-delay: 0.2s; }
      .loader-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes loader-breathe {
        0%,100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes loader-dot {
        0%,80%,100% { opacity: 0.2; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1.3); }
      }
      /* Floating specks */
      .loader-speck {
        position: absolute; width: 2px; height: 2px; border-radius: 50%;
        background: rgba(255,212,160,0.5);
        animation: loader-float 6s linear infinite;
      }
      @keyframes loader-float {
        0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
        10% { opacity: 0.7; }
        90% { opacity: 0.7; }
        100% { transform: translateY(-100vh) translateX(30px) scale(0); opacity: 0; }
      }
    </style>
    <script type="module" crossorigin src="/good-night/assets/index-Mcnjrz82.js"></script>
    <link rel="modulepreload" crossorigin href="/good-night/assets/three-C2InbUjW.js">
    <link rel="stylesheet" crossorigin href="/good-night/assets/index-ajIXOaQ6.css">
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loader">
      <div class="loader-title">🌙 Good Night</div>
      <div class="loader-sub">Dream State Machine</div>
      <div class="loader-dots">
        <div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div>
      </div>
    </div>

    <div id="app">
      <div id="ui-overlay"></div>
      <div id="prompt-layer"></div>
      <div id="state-indicator">AWAKE</div>
    </div>

    <!-- Webcam PIP -->
    <div id="webcam-pip">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="hand-canvas"></canvas>
    </div>
